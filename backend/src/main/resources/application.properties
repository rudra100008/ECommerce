spring.application.name=demo
logging.level.com.E_Commerce.Securty =debug
logging.level.org.springframework.security=debug

spring.datasource.url=jdbc:mysql://localhost:3306/ECommerce
spring.datasource.username=root
spring.datasource.password=ashum
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# Batch processing
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.jpa.open-in-view=false

# For All Pessimistic lock
spring.jpa.properties.jakarta.persistence.lock.timeout=3000



#OAuth2 Configuration
#google configure
spring.security.oauth2.client.registration.google.client-name=google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google


#jwt Configuration
#to create token secret key -> https://jwtsecret.com/generate
spring.token.secret= ${JWT_SECRET_KEY}
# 24 hrs
jwt.token.expires= ${JWT_EXPIRES}


#image directory
image.upload.dir=${IMAGE_UPLOAD_DIR:${user.home}/ecommerce/images}



#redis cache config
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.enable-statistics=true
spring.data.redis.repositories.enabled=false